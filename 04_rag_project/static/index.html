<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>我的知识库</title>
  <style>
    body { font-family: "Microsoft YaHei", system-ui, sans-serif; max-width: 760px; margin: 40px auto; padding: 0 16px; color: #222; }
    h1 { font-size: 20px; margin-bottom: 4px; }
    .hint { font-size: 13px; color: #888; margin-bottom: 22px; }
    .row { display: flex; gap: 8px; }
    input { flex: 1; padding: 10px 12px; font-size: 15px; border: 1px solid #ccc; border-radius: 6px; outline: none; }
    input:focus { border-color: #1F3864; }
    button { padding: 10px 18px; font-size: 15px; border: 0; border-radius: 6px; background: #1F3864; color: #fff; cursor: pointer; min-width: 88px; }
    button:disabled { background: #999; cursor: default; }
    #answer { margin-top: 24px; white-space: pre-wrap; line-height: 1.8; font-size: 15px; }
    #sources { margin-top: 18px; font-size: 13px; color: #555; }
    #sources div { padding: 5px 0; border-top: 1px dashed #ddd; }
    .warn { color: #B45309; }
  </style>
</head>
<body>
  <h1>我的知识库</h1>
  <div class="hint">问它关于我自己的事 —— 它只根据我上传的资料回答</div>

  <div class="row">
    <input id="q" placeholder="比如:我的猫叫什么名字?" autocomplete="off" />
    <button id="btn" type="button">提问</button>
  </div>

  <div id="answer"></div>
  <div id="sources"></div>

  <script>
    const btn  = document.getElementById("btn");
    const qEl  = document.getElementById("q");
    const ansEl = document.getElementById("answer");
    const srcEl = document.getElementById("sources");

    // 口令从链接里取:分享出去的链接就是 https://xxxx/?k=你的口令
    // 陌生人拿到普通链接调用接口会收到 403
    const K = new URLSearchParams(location.search).get("k") || "";
    const withKey = url => K ? url + (url.includes("?") ? "&" : "?") + "k=" + encodeURIComponent(K) : url;

    function say(msg, warn) {
      ansEl.textContent = msg;
      ansEl.className = warn ? "warn" : "";
    }

    async function ask() {
      const q = qEl.value.trim();
      if (!q) {                       // 空输入也要有反馈,不能"点了没反应"
        say("请先输入问题。", true);
        qEl.focus();
        return;
      }

      btn.disabled = true;
      btn.textContent = "思考中";
      say("正在检索资料…");
      srcEl.innerHTML = "";

      // 超时保护:万一后端卡住,按钮也不会永远变灰点不动
      const ctrl  = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), 60000);

      try {
        const resp = await fetch(withKey("/ask"), {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ q: q }),
          signal: ctrl.signal,
        });
        if (resp.status === 403) throw new Error("口令不对 —— 链接末尾要带 ?k=你的口令");
        if (!resp.ok) throw new Error("HTTP " + resp.status);

        const data = await resp.json();
        say(data.answer || "(后端返回了空答案)");

        const list = data.sources || [];
        const best = list.length ? list[0].distance : 0;
        srcEl.innerHTML = list
          .filter(s => s.distance <= best + 0.15)          // 只留"断层之内"的出处,砍掉噪音
          .map(s => `<div>出处:${s.source} 第${s.para}段 · 距离 ${s.distance}</div>`)
          .join("");
      } catch (e) {
        const msg = (e.name === "AbortError")
          ? "请求超过 60 秒没返回 —— 去看后端那个终端窗口,通常那里有红字"
          : e.message;
        say("出错了:" + msg + "(F12 → Console / Network 看详情)", true);
      } finally {
        clearTimeout(timer);
        btn.disabled = false;
        btn.textContent = "提问";
      }
    }

    btn.addEventListener("click", ask);
    qEl.addEventListener("keydown", e => { if (e.key === "Enter") ask(); });

    // 页面脚本一旦报错,直接显示在页面上(不用去翻 F12)
    window.addEventListener("error", e => say("页面脚本报错:" + e.message, true));
  </script>
</body>
</html>
